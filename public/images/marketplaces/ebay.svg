  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="160" letter-spacing="-14">
    <!-- e (Red) -->
    <text x="50" y="310" fill="#E53238">e</text>
    <!-- b (Blue) -->
    <text x="135" y="310" fill="#0064D2">b</text>
    <!-- a (Yellow) -->
    <text x="228" y="310" fill="#F5AF02">a</text>
